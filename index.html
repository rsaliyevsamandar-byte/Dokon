let cart = [];

function showProducts(list) {
  let html = "";
  list.forEach((p, i) => {
    html += `
      <div class="product">
        <img src="${p.img}" alt="${p.name}">
        <h3>${p.name}</h3>
        <p>${p.price} so‘m</p>
        <button onclick="addToCart(${i})">Savatga qo‘shish</button>
      </div>
    `;
  });
  document.getElementById("products").innerHTML = html;
}

function addToCart(i) {
  let existing = cart.find(item => item.name === products[i].name);
  if (existing) {
    existing.qty += 1;
  } else {
    cart.push({ ...products[i], qty: 1 });
  }
  showCart();
}

function showCart() {
  let html = "";
  let total = 0;

  cart.forEach((p, index) => {
    html += `
      <li>
        ${p.name} - ${p.price} so‘m x ${p.qty}
        <button onclick="increaseQty(${index})">➕</button>
        <button onclick="decreaseQty(${index})">➖</button>
        <button onclick="removeFromCart(${index})">❌ O‘chirish</button>
      </li>
    `;
    total += p.price * p.qty;
  });

  html += `<h3>Jami: ${total} so‘m</h3>`;
  document.getElementById("cart").innerHTML = html;
}

function increaseQty(i) {
  cart[i].qty += 1;
  showCart();
}

function decreaseQty(i) {
  if (cart[i].qty > 1) {
    cart[i].qty -= 1;
  } else {
    cart.splice(i, 1);
  }
  showCart();
}

function removeFromCart(i) {
  cart.splice(i, 1);
  showCart();
}

function searchProduct() {
  let value = document.getElementById("search").value.toLowerCase();
  let filtered = products.filter(p => p.name.toLowerCase().includes(value));
  showProducts(filtered);
}

function filterByCategory() {
  let cat = document.getElementById("categoryFilter").value;
  if (cat === "all") {
    showProducts(products);
  } else {
    let filtered = products.filter(p => p.category === cat);
    showProducts(filtered);
  }
}

function order() {
  let text = "Salom, buyurtma:%0A";
  cart.forEach(p => {
    text += `${p.name} x${p.qty} - ${p.price * p.qty} so‘m%0A`;
  });

  window.open("https://t.me/rsaliyev1?text=" + text);
}
