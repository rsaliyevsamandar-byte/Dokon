<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Do‘konim</title>
  <style>
    :root {
      --bg: #ecf5ff;
      --surface: #ffffff;
      --surface-soft: #f7fcf8;
      --border: rgba(31, 79, 39, 0.12);
      --text: #213547;
      --text-muted: #58666f;
      --primary: #1f7f35;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: Inter, Arial, sans-serif;
      background: linear-gradient(180deg, var(--bg) 0%, #f7fafc 60%, #f0f2f5 100%);
      color: var(--text);
      padding: 126px 14px 14px;
    }

    .page-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(31, 79, 39, 0.08);
      box-shadow: 0 12px 28px rgba(31, 79, 39, 0.1);
      padding: 12px 14px 10px;
    }

    .page-header h1 {
      margin: 0;
      font-size: 1.35rem;
      text-align: center;
      color: var(--primary);
    }

    .top-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 10px;
    }

    .top-bar input,
    .top-bar select {
      border: 1px solid rgba(31, 79, 39, 0.16);
      border-radius: 14px;
      padding: 10px 12px;
      background: #fff;
      color: var(--text);
      font-size: 0.95rem;
      box-shadow: inset 0 1px 2px rgba(31, 79, 39, 0.05);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .top-bar input {
      flex: 1 1 220px;
      min-width: 120px;
      max-width: 280px;
    }

    .top-bar select {
      flex: 0 0 140px;
      min-width: 120px;
      max-width: 160px;
    }

    .top-bar input:focus,
    .top-bar select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(31, 127, 53, 0.12);
    }

    #products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 14px;
      max-width: 1200px;
      margin: 0 auto 260px;
    }

    .product {
      background: var(--surface);
      border-radius: 20px;
      padding: 14px;
      text-align: center;
      box-shadow: 0 16px 32px rgba(31, 79, 39, 0.08);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 300px;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .product:hover {
      transform: translateY(-3px);
      box-shadow: 0 22px 42px rgba(31, 79, 39, 0.14);
    }

    .product img {
      width: 100%;
      height: 160px;
      object-fit: contain;
      border-radius: 16px;
      background: #f5fbff;
      margin-bottom: 14px;
    }

    .product h3 {
      margin: 0 0 10px;
      font-size: 1.05rem;
      color: #1c3c2a;
    }

    .product p {
      margin: 0 0 16px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .product button {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.18s ease;
    }

    .product button:hover {
      background: #22964a;
    }

    #cartContainer {
      position: fixed;
      bottom: 12px;
      left: 12px;
      right: 12px;
      max-height: 320px;
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid rgba(31, 79, 39, 0.16);
      border-radius: 22px;
      box-shadow: 0 24px 52px rgba(31, 79, 39, 0.12);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 900;
    }

    #cartHeader {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    #cartHeader h2 {
      margin: 0;
      font-size: 1.05rem;
      color: var(--primary);
    }

    #cartToggle {
      background: transparent;
      border: 1px solid rgba(31, 79, 39, 0.18);
      color: var(--primary);
      border-radius: 12px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 0.95rem;
    }

    #cart {
      list-style: none;
      margin: 0;
      padding: 0;
      overflow-y: auto;
      flex: 1;
      min-height: 40px;
    }

    #cart li {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      border-radius: 14px;
      background: var(--surface-soft);
      border: 1px solid rgba(31, 79, 39, 0.08);
      margin-bottom: 10px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .cart-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .cart-actions button {
      border: 1px solid rgba(31, 79, 39, 0.18);
      background: transparent;
      color: var(--primary);
      border-radius: 12px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 0.88rem;
    }

    #cartFooter {
      margin-top: 10px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
    }

    #cartFooter p {
      margin: 0;
      font-weight: 700;
      color: #2f4b2f;
    }

    #cartFooter button {
      width: 100%;
      border: none;
      background: var(--primary);
      color: #fff;
      border-radius: 16px;
      padding: 12px 16px;
      cursor: pointer;
      font-size: 0.97rem;
    }

    #cartContainer.collapsed {
      max-height: 52px;
      padding-bottom: 8px;
    }

    #cartContainer.collapsed #cart,
    #cartContainer.collapsed #cartFooter {
      display: none;
    }

    @media (max-width: 860px) {
      body { padding-top: 142px; }
      #products { gap: 12px; }
    }

    @media (max-width: 640px) {
      body { padding-top: 152px; }
      .page-header { padding: 10px 12px 10px; }
      .page-header h1 { font-size: 1.05rem; }
      .top-bar { gap: 6px; }
      .top-bar input, .top-bar select { width: 100%; max-width: none; }
      .product { min-height: auto; padding: 14px 12px; }
      .product img { height: 140px; }
      .product h3 { font-size: 1rem; }
      .product p { font-size: 0.92rem; margin-bottom: 10px; }
      .product button { padding: 10px 12px; font-size: 0.94rem; }
      #cartContainer { left: 10px; right: 10px; bottom: 10px; border-radius: 20px; padding: 12px; }
      #cartContainer.collapsed { max-height: 48px; }
    }

    @media (max-width: 480px) {
      body { padding-top: 156px; }
      .page-header h1 { font-size: 0.98rem; }
      #cartHeader h2 { font-size: 0.98rem; }
      #cartFooter { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="page-header">
    <h1>🛒 Do‘kon</h1>
    <div class="top-bar">
      <input type="text" id="search" placeholder="Qidirish..." oninput="searchProduct()">
      <select id="categoryFilter" onchange="searchProduct()">
        <option value="all">Barchasi</option>
        <option value="ichimlik">Ichimliklar</option>
        <option value="shirinlik">Shirinliklar</option>
        <option value="ro'zg'or">Ro‘zg‘or</option>
      </select>
    </div>
  </div>

  <div id="products"></div>

  <div id="cartContainer" class="collapsed">
    <div id="cartHeader">
      <h2>🧺 Savat</h2>
      <button id="cartToggle" onclick="toggleCart()">Ochish</button>
    </div>
    <ul id="cart"></ul>
    <div id="cartFooter">
      <p id="cartTotal">Jami: 0 so‘m</p>
      <button onclick="order()">Buyurtma berish</button>
    </div>
  </div>

  <script>
    const products = [
      { name: "Kola 2L", price: 20000, img: "kola.jpg", category: "ichimlik" },
      { name: "Pepsi 1L", price: 12000, img: "pepsi.jpg", category: "ichimlik" },
      { name: "Fanta 0.5L", price: 8000, img: "fanta.jpg", category: "ichimlik" },
      { name: "Sprite 1.5L", price: 15000, img: "sprite.jpg", category: "ichimlik" },
      { name: "Lipton 0.5L", price: 8000, img: "lipton.jpg", category: "ichimlik" },
      { name: "Snickers", price: 9000, img: "snickers.jpg", category: "shirinlik" },
      { name: "KitKat", price: 10000, img: "kitkat.jpg", category: "shirinlik" },
      { name: "Twix", price: 9500, img: "twix.jpg", category: "shirinlik" },
      { name: "Orbit", price: 6000, img: "orbit.jpg", category: "shirinlik" },
      { name: "Chupa Chups", price: 1000, img: "chupachups.jpg", category: "shirinlik" },
      { name: "Kir sovun", price: 6000, img: "kirsovun.jpg", category: "ro'zg'or" },
      { name: "Makaron 1kg", price: 12000, img: "makaron1.jpg", category: "ro'zg'or" },
      { name: "Moloko 350gr", price: 13000, img: "moloko350.jpg", category: "ro'zg'or" }
    ];

    const defaultImg = 'data:image/svg+xml;charset=UTF-8,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200"%3E%3Crect width="300" height="200" fill="%23ececec"/%3E%3Ctext x="50%25" y="50%25" dominant-baseline="middle" text-anchor="middle" fill="%23999" font-family="Arial,Helvetica,sans-serif" font-size="18"%3ENo+image%3C/text%3E%3C/svg%3E';

    const telegramConfig = {
      botToken: "8998474143:AAHRwF3maPykjMmswx8hyJU3NOBenfaf-YM",
      chatId: "8341622654"
    };

    let cart = [];
    let cartOpen = false;

    function showProducts(list) {
      const container = document.getElementById('products');
      container.innerHTML = list.map((product, index) => `
        <div class="product">
          <img src="${product.img}" onerror="this.src='${defaultImg}'" alt="${product.name}">
          <h3>${product.name}</h3>
          <p>${product.price.toLocaleString('uz-UZ')} so‘m</p>
          <button onclick="addToCart(${index})">Savatga qo‘shish</button>
        </div>
      `).join('');
    }

    function addToCart(index) {
      const selected = products[index];
      const item = cart.find(entry => entry.name === selected.name);
      if (item) item.quantity += 1;
      else cart.push({ ...selected, quantity: 1 });
      showCart();
    }

    function changeQuantity(index, delta) {
      cart[index].quantity += delta;
      if (cart[index].quantity <= 0) cart.splice(index, 1);
      showCart();
    }

    function showCart() {
      const cartList = document.getElementById('cart');
      const totalEl = document.getElementById('cartTotal');
      if (!cart.length) {
        cartList.innerHTML = '<li>Savat bo‘sh</li>';
        totalEl.textContent = 'Jami: 0 so‘m';
        return;
      }

      let total = 0;
      cartList.innerHTML = cart.map((item, index) => {
        const itemTotal = item.price * item.quantity;
        total += itemTotal;
        return `
          <li>
            <span>${item.name} x ${item.quantity}</span>
            <div class="cart-actions">
              <button onclick="changeQuantity(${index}, 1)">+</button>
              <button onclick="changeQuantity(${index}, -1)">-</button>
            </div>
          </li>
        `;
      }).join('');

      totalEl.textContent = `Jami: ${total.toLocaleString('uz-UZ')} so‘m`;
    }

    function searchProduct() {
      const query = document.getElementById('search').value.toLowerCase();
      const category = document.getElementById('categoryFilter').value;
      const filtered = products.filter(product => {
        const matchesQuery = product.name.toLowerCase().includes(query);
        const matchesCategory = category === 'all' || product.category === category;
        return matchesQuery && matchesCategory;
      });
      showProducts(filtered);
    }

    function toggleCart() {
      cartOpen = !cartOpen;
      const cartContainer = document.getElementById('cartContainer');
      const toggle = document.getElementById('cartToggle');
      cartContainer.classList.toggle('collapsed', !cartOpen);
      toggle.textContent = cartOpen ? 'Yopish' : 'Ochish';
    }

    function order() {
      if (!cart.length) {
        alert('Savat bo‘sh. Iltimos, mahsulot qo‘shing.');
        return;
      }

      const cartLines = cart.map(item => `${item.name} x ${item.quantity} = ${item.price * item.quantity} so‘m`);
      const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
      const message = `Yangi buyurtma:%0A${cartLines.join('%0A')}%0AJami: ${total} so‘m`;
      sendOrderToTelegram(message)
        .then(() => alert('Buyurtmangiz qabul qilindi!'))
        .catch(() => {
          window.open(`https://t.me/rsaliyev1?text=${message}`, '_blank');
        });
    }

    function resolveTelegramChatId() {
      const chatId = String(telegramConfig.chatId || '').trim();
      if (!chatId) return Promise.reject(new Error('Telegram chat ID yo‘q'));
      if (/^@/.test(chatId) || /\D/.test(chatId)) {
        return fetch(`https://api.telegram.org/bot${encodeURIComponent(telegramConfig.botToken)}/getChat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: chatId })
        }).then(res => res.json()).then(data => {
          if (!data.ok) throw new Error(data.description || 'getChat xatoligi');
          return String(data.result.id);
        });
      }
      return Promise.resolve(chatId);
    }

    function sendOrderToTelegram(message) {
      return resolveTelegramChatId().then(resolvedChatId => {
        return fetch(`https://api.telegram.org/bot${encodeURIComponent(telegramConfig.botToken)}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: resolvedChatId, text: message })
        }).then(res => {
          if (!res.ok) return res.json().then(data => Promise.reject(new Error(data.description || 'Telegram xatoligi')));
        });
      });
    }

    showProducts(products);
    showCart();
  </script>
</body>
</html>
